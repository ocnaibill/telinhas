[package]
name = "telinhas-net"
description = "Signaling client for Telinhas: rooms, reconnection and the events the interface shows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
rand = "0.10.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
telinhas-protocol = { path = "../protocol" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
telinhas-signaling = { path = "../signaling" }
