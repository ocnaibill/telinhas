[workspace]
resolver = "2"
members = ["app", "capture", "codec", "media", "net", "protocol", "signaling", "spike", "ui-spike", "update"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ocnaibill/telinhas"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Software H.264 is far too slow unoptimized, and the spike tests run in debug.
[profile.dev.package.openh264-sys2]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.telinhas-spike]
opt-level = 3
[profile.dev.package.telinhas-ui-spike]
opt-level = 3
[profile.dev.package.telinhas-media]
opt-level = 3
