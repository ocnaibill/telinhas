[package]
name = "telinhas-spike"
description = "M2 spike: synthetic H.264 over WebRTC between two peers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Hardware encoding through the FFmpeg libraries (see docs/PLANO-M3.md).
ffmpeg = ["telinhas-codec/ffmpeg"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
futures-util = "0.3.34"
openh264 = "0.9.10"
rand = "0.10.4"
rtc = "0.21.1"
rtc-signal = "0.21.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde_json = "1.0.154"
telinhas-capture = { path = "../capture" }
telinhas-codec = { path = "../codec" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webrtc = "0.21.1"

[target.'cfg(windows)'.dependencies]
wasapi = "0.27.0"
