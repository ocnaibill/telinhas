[package]
name = "telinhas-signaling"
description = "Signaling server for Telinhas: ephemeral room state and SDP/ICE relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
telinhas-protocol = { path = "../protocol" }
axum = { version = "0.8.9", features = ["ws"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "set-header"] }
uuid = { version = "1.29.2", features = ["v4", "serde"] }

[dev-dependencies]
sha2 = "0.10"
telinhas-update = { path = "../update" }
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
