[package]
name = "telinhas-media"
description = "Video between Telinhas peers: WebRTC links, capture and encode on one side, decode on the other"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Hardware encoding through the FFmpeg libraries (see docs/PLANO-M3.md).
ffmpeg = ["telinhas-codec/ffmpeg"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
openh264 = "0.9.10"
opus = "0.4"
rand = "0.10.4"
rtc = "0.21.1"
rtc-signal = "0.21.1"
serde_json = "1.0.154"
telinhas-capture = { version = "0.0.0", path = "../capture" }
telinhas-codec = { version = "0.0.0", path = "../codec" }
telinhas-protocol = { version = "0.0.0", path = "../protocol" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
webrtc = "0.21.1"
