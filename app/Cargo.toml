[package]
name = "telinhas"
description = "Desktop client for Telinhas: screen, window and webcam streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Keeps the console window of a Windows release build, to read logs.
console = []
# Hardware encoding (NVENC) through the FFmpeg libraries; see docs/PLANO-M3.md.
ffmpeg = ["telinhas-media/ffmpeg"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11", "persistence"] }
egui-phosphor = "0.14"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
resvg = "0.45"
telinhas-capture = { path = "../capture" }
telinhas-media = { path = "../media" }
telinhas-net = { path = "../net" }
telinhas-protocol = { path = "../protocol" }

# Embeds the icon in the Windows executable, so Explorer and the taskbar show it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
telinhas-signaling = { path = "../signaling" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
